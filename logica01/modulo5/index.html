<meta charset="UTF-8" />
<script>

    function calcularImc (peso,altura) {
        var imc = peso / (altura * altura);
        return imc;
    }
    
    function pularLinha() {
        document.write('<br>');
    }

    function mostra(frase) {
        document.write(frase);
        pularLinha();
    }

    var imcVictor = calcularImc(70, 1.62);
    mostra(Math.round(imcVictor));

</script>
