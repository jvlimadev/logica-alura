<meta charset="UTF-8" />
<script>

    function calcularImc (peso,altura) {
        var imc = peso / (altura * altura);
        mostra('O cálculo do IMC é: ' + Math.round(imc));
    }
    
    function pularLinha() {
        document.write('<br>');
    }

    function mostra(frase) {
        document.write(frase);
        pularLinha();
    }

    calcularImc(70, 1.62);

</script>
